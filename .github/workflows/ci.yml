name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy src tests

      - name: Time pit-alpha unit and canary suite
        run: uv run python -m scripts.qualify_pit_alpha test --output dist/pit-alpha-tests.json

      - name: pytest
        run: uv run pytest

      - name: quantcheck --help
        run: uv run quantcheck --help

      - name: Build wheel and sdist
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv build --offline --no-build-isolation
          uv run python scripts/check_distribution_contents.py dist

      - name: Qualify the installed release candidate
        run: |
          candidate_env="${RUNNER_TEMP}/quantcheck-candidate"
          uv venv --python 3.12 "$candidate_env"
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/quantcheck-requirements.txt"
          uv pip sync --require-hashes --python "$candidate_env/bin/python" "$RUNNER_TEMP/quantcheck-requirements.txt"
          uv pip install --python "$candidate_env/bin/python" --no-deps --offline dist/quantcheck-*.whl
          uv run python -m scripts.qualify_pit_alpha package --python "$candidate_env/bin/python" --output dist
          (cd dist && sha256sum *.whl *.tar.gz *.json *.md > SHA256SUMS)

      - name: Publish qualified package and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quantcheck-pit-alpha-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 90

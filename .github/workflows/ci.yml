name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gates:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.2"

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen)
        run: uv sync --frozen --all-groups

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy
        run: uv run mypy src tests

      - name: Time pit-alpha unit and canary suite
        run: uv run python -m scripts.qualify_pit_alpha test --output dist/pit-alpha-tests.json

      - name: pytest
        run: uv run pytest

      - name: quantcheck --help
        run: uv run quantcheck --help

      - name: Build and qualify the wheel and source distribution
        run: bash scripts/qualify_pit_alpha_distributions.sh dist

      - name: Publish qualified package and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quantcheck-pit-alpha-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 90
